          - Completions: server/completions.md
          - Stores and pagination: server/stores.md
          - Custom handlers: server/handlers.md
          - Extensions: server/extensions.md
          - Tasks: server/tasks.md
          - Apps: server/apps.md
          - Subscriptions: server/subscriptions.md
          - Asking the client for input: server/input-required.md
          - Attribute discovery: attribute-discovery.md
      - Client:
          - Client API overview: client.md
          - Connecting and discovery: client/connecting.md
          - Typed requests: client/requests.md
          - When the server asks for input first: client/input-required.md
          - Progress and timeouts: client/progress-and-timeouts.md
          - Notification handlers: client/notifications.md
          - Extensions: client/extensions.md
