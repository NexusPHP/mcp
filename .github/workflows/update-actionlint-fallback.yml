name: Update Actionlint Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-actionlint-fallback:
    name: Update fallback actionlint pin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Update fallback actionlint version and checksum
        run: python3 .github/scripts/update_actionlint_fallback.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet .github/scripts/install-actionlint.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-actionlint
          commit-message: 'Update actionlint version'
          title: 'Update actionlint version'
          body: |
            This automated change updates the actionlint binary version in `.github/scripts/install-actionlint.sh`, which is used by `.github/workflows/yaml-validation.yml`.
          add-paths: |
            .github/scripts/install-actionlint.sh
          delete-branch: true
