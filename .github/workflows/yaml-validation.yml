name: YAML Validation

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/**/*.yml
      - .github/dependabot.yml
      - .github/scripts/validate_yaml.py
      - .github/scripts/requirements.txt
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/**/*.yml
      - .github/dependabot.yml
      - .github/scripts/validate_yaml.py
      - .github/scripts/requirements.txt

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-yaml:
    name: Validate YAML files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt

      - name: Validate repository YAML files
        run: python3 .github/scripts/validate_yaml.py

      - name: Install actionlint fallback binary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: .github/scripts/install-actionlint.sh

      - name: Validate GitHub Actions workflows with fallback binary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: .github/scripts/actionlint -color

  reviewdog-actionlint:
    name: Reviewdog Actionlint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows with reviewdog
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: nofilter
          fail_level: error
          level: error
          actionlint_flags: -color
