name: Deploy API Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/deploy-api.yml
      - api/**
      - src/**

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'NexusPHP/mcp-sdk'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer update --ansi
          composer update --ansi --working-dir=api

      - name: Audit dependencies
        run: |
          composer audit --ansi --abandoned=report
          composer audit --ansi --working-dir=api --abandoned=report

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate API documentation
        run: api/vendor/bin/apigen src --ansi --output api/docs --config api/apigen.neon

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: api/docs

  deploy:
    name: Deploy API documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
