name: Conformance

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/conformance.yml
      - conformance/**
      - src/**
      - composer.json
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/conformance.yml
      - conformance/**
      - src/**
      - composer.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-conformance:
    name: Server mode
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # The referee is a Node CLI. It is pinned in conformance/run-server.sh rather
      # than here, so the version and the baseline it was reconciled against move
      # together in one file. The referee itself declares no engine constraint, so
      # this tracks the active Node LTS.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-8.4-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      # Blocking, and safe to be: the run exits 0 when the only failures are the
      # ones conformance/expected-failures.yaml already accounts for, and exits 1
      # both on a new failure and on a baselined scenario that has started passing.
      - name: Run the conformance suite
        run: composer conformance:server -- --suite all

      # Extension-tagged scenarios sit outside every referee suite, so they run
      # targeted here and score into their own badge bucket.
      - name: Run the extension scenarios
        run: composer conformance:extensions:server

      # Each job runs on its own runner, so this only ever sees the mode that job
      # ran. score.php names the mode in its heading, so two summaries stay
      # distinguishable in the combined run output.
      - name: Publish the score
        if: always()
        run: composer conformance:score >> "$GITHUB_STEP_SUMMARY"

      # The README badges read the committed JSON straight off the default branch,
      # so a stale file would advertise a score nobody measured. Regenerating and
      # diffing makes that a build failure instead.
      - name: Check the score badge is current
        run: |
          composer conformance:badge
          git diff --exit-code -- conformance/badges/ \
            || { echo "::error::conformance/badges/ is stale. Run 'composer conformance:badge' and commit the result."; exit 1; }

      # The fixture admits both spellings of the loopback authority, but the run above
      # reaches it by only one, and the Origin check is the only thing that tells them
      # apart. Scoring runs first, so this leaves the published number untouched.
      - name: Re-run the origin-sensitive scenario as localhost
        run: URL_HOST=localhost composer conformance:server -- --scenario dns-rebinding-protection

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results-server
          path: conformance/results/
          retention-days: 14

  client-conformance:
    name: Client mode
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-8.4-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      # The referee is the server here, so nothing needs starting first: it stands
      # up a mock per scenario and spawns the client once per scenario.
      - name: Run the conformance suite
        run: composer conformance:client -- --suite all

      # Extension-tagged scenarios sit outside every referee suite, so they run
      # targeted here and score into their own badge bucket.
      - name: Run the extension scenarios
        run: composer conformance:extensions:client

      # Each job runs on its own runner, so this only ever sees the mode that job
      # ran. score.php names the mode in its heading, so two summaries stay
      # distinguishable in the combined run output.
      - name: Publish the score
        if: always()
        run: composer conformance:score >> "$GITHUB_STEP_SUMMARY"

      # The README badges read the committed JSON straight off the default branch,
      # so a stale file would advertise a score nobody measured. Regenerating and
      # diffing makes that a build failure instead.
      - name: Check the score badge is current
        run: |
          composer conformance:badge
          git diff --exit-code -- conformance/badges/ \
            || { echo "::error::conformance/badges/ is stale. Run 'composer conformance:badge' and commit the result."; exit 1; }

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results-client
          path: conformance/results/
          retention-days: 14
