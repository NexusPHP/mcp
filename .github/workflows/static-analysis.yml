name: Static Analysis

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/static-analysis.yml
      - src/**
      - tests/**
      - composer.json
      - phpstan.dist.neon
      - phpstan-baseline.php
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/static-analysis.yml
      - src/**
      - tests/**
      - composer.json
      - phpstan.dist.neon
      - phpstan-baseline.php

env:
  DEFAULT_PHP_VERSION: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Run PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: none
          ini-values: zend.assertions=1, assert.exception=1, error_reporting=-1, display_errors=On, display_startup_errors=On

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.DEFAULT_PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ env.DEFAULT_PHP_VERSION }}-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      - name: Run Composer security audit
        run: composer audit --ansi --abandoned=report

      - name: Run PHPStan
        run: composer phpstan:check

      - name: Run PHPStan type inference tests
        run: composer test:stan
