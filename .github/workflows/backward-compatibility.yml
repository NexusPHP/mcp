name: Backward Compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/backward-compatibility.yml
      - src/**
      - bc/composer.json
      - composer.json
      - .roave-backward-compatibility-check.xml
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/backward-compatibility.yml
      - src/**
      - bc/composer.json
      - composer.json
      - .roave-backward-compatibility-check.xml

env:
  DEFAULT_PHP_VERSION: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backward-compatibility:
    name: Check public API against the latest stable tag
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The comparison target is the latest stable tag, so the tags must exist locally, shallow or not.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.DEFAULT_PHP_VERSION }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ env.DEFAULT_PHP_VERSION }}-
            composer-

      - name: Install BC tooling
        run: composer update --working-dir=bc --ansi

      - name: Check for backward-compatibility breaks
        run: composer bc:check -- --ansi --format=markdown
