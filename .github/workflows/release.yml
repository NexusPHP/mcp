name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    name: Create a release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Capture this tag's section, then unwrap it: the changelog hard-wraps to a column limit,
          # which GitHub renders as one long line anyway, so every block collapses to a single line.
          # Blank lines, headings and fenced code delimit blocks and pass through untouched.
          body="$(awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1     { capture = 1; next }
            capture && index($0, "## [") == 1  { exit }
            capture                            { print }
          ' CHANGELOG.md | awk '
            function flush() { if (started) { print line; started = 0 } }
            /^```/                    { flush(); fence = ! fence; print; next }
            fence                     { print; next }
            /^[[:space:]]*$/          { flush(); print; next }
            /^[[:space:]]*[-*+][ \t]/ { flush(); line = $0; started = 1; next }
            /^[[:space:]]*#/          { flush(); print; next }
            started                   { sub(/^[[:space:]]+/, ""); line = line " " $0; next }
                                      { line = $0; started = 1 }
            END { flush() }
          ' | sed '/./,$!d')"

          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section. Prepare the changelog before tagging (see .github/RELEASE.md)."
            exit 1
          fi

          url="$(grep -m1 -F "## [$TAG]" CHANGELOG.md | sed -nE 's/^[^(]*\(([^)]+)\).*/\1/p')"
          {
            printf "## What's Changed\n\n"
            printf '%s\n' "$body"
            if [ -n "$url" ]; then
              printf '\n**Full Changelog**: %s\n' "$url"
            fi
          } > release-notes.md

      - name: Create release from changelog
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_ACTIONS_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --notes-file release-notes.md
