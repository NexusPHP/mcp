name: Carson

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - reopened
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed
  pull_request_review_comment:
    types:
      - created
  push:
    branches:
      - 1.x
  delete:
  schedule:
    - cron: '0 4 * * *'

permissions: {}

jobs:
  carson:
    name: Run Carson
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@53c45cf25e2303bc503209f8b5dd9107f27b2e8f # v1.8.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info
