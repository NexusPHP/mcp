name: Carson

on:
  issues:
    types:
      - opened
      - edited
      - labeled
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
  push:
    branches:
      - 1.x
  schedule:
    - cron: '0 4 * * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  carson:
    name: Run Carson
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run Carson
        uses: NexusPHP/carson@80ba8380498b061f22de749c7609f265c8d66120 # v1.3.0
        with:
          app_id: ${{ secrets.CARSON_APP_ID }}
          private_key: ${{ secrets.CARSON_PRIVATE_KEY }}
          log_level: info
