name: Deploy documentation

on:
  workflow_dispatch:
  push:
    branches:
      - 1.x
    paths:
      - .github/scripts/requirements-docs.txt
      - .github/workflows/deploy-docs.yml
      - api/**
      - docs/**
      - mkdocs.yml
      - src/**
      - tools/stage-docs-site
      - tools/src/DocsSiteStager.php
  pull_request:
    paths:
      - .github/scripts/requirements-docs.txt
      - .github/workflows/deploy-docs.yml
      - docs/**
      - mkdocs.yml
      - tools/stage-docs-site
      - tools/src/DocsSiteStager.php

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'NexusPHP/mcp'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/scripts/requirements-docs.txt

      - name: Install Zensical
        run: pip install -r .github/scripts/requirements-docs.txt

      - name: Stage guide docs
        run: composer docs:stage

      - name: Build guides site
        run: zensical build --strict

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: |
          composer update --ansi
          composer update --ansi --working-dir=api

      - name: Audit dependencies
        if: github.event_name != 'pull_request'
        run: |
          composer audit --ansi --abandoned=report
          composer audit --ansi --working-dir=api --abandoned=report

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate API documentation
        if: github.event_name != 'pull_request'
        run: api/vendor/bin/apigen src --ansi --output build/pages/api --config api/apigen.neon

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
