name: Mutation Testing

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/mutation.yml
      - src/**
      - tests/**
      - composer.json
      - infection.json5
      - phpstan.dist.neon
      - phpstan-baseline.php
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/mutation.yml
      - src/**
      - tests/**
      - composer.json
      - infection.json5
      - phpstan.dist.neon
      - phpstan-baseline.php

env:
  DEFAULT_PHP_VERSION: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: Check Code Quality with Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.DEFAULT_PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ env.DEFAULT_PHP_VERSION }}-
            composer-

      - name: Install dependencies
        run: |
          composer update --ansi
          composer audit --ansi

      - name: Run mutation testing on full codebase (push)
        if: github.event_name == 'push'
        run: composer mutation:check
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}

      - name: Run mutation testing on changed files (pull request)
        if: github.event_name == 'pull_request'
        run: composer mutation:filter
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
