name: Package Structure

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/package-structure.yml
      - src/**
      - structarmed.php
      - composer.json
      - tools/composer.json
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/package-structure.yml
      - src/**
      - structarmed.php
      - composer.json
      - tools/composer.json

env:
  PHP_VERSION_DEFAULT: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-structure:
    name: Check layer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ env.PHP_VERSION_DEFAULT }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.PHP_VERSION_DEFAULT }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ env.PHP_VERSION_DEFAULT }}-
            composer-

      - name: Install dependencies
        run: composer update --ansi --no-interaction

      - name: Run architecture boundary checks
        run: composer arch:check
