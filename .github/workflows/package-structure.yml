name: Package Structure

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/package-structure.yml
      - conformance/**
      - examples/**
      - src/**
      - tests/**
      - structarmed.php
      - composer-dependency-analyser.php
      - composer.json
      - tools/composer.json
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/package-structure.yml
      - conformance/**
      - examples/**
      - src/**
      - tests/**
      - structarmed.php
      - composer-dependency-analyser.php
      - composer.json
      - tools/composer.json

env:
  DEFAULT_PHP_VERSION: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-structure:
    name: Check package structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.DEFAULT_PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ env.DEFAULT_PHP_VERSION }}-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      - name: Run architecture boundary checks
        run: composer arch:check

      - name: Run dependency analysis
        run: composer deps:check
