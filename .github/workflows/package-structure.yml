name: Package Structure

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/package-structure.yml
      - conformance/**
      - examples/**
      - src/**
      - tests/**
      - structarmed.php
      - composer-dependency-analyser.component.php
      - composer-dependency-analyser.php
      - composer.json
      - tools/composer.json
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/package-structure.yml
      - conformance/**
      - examples/**
      - src/**
      - tests/**
      - structarmed.php
      - composer-dependency-analyser.component.php
      - composer-dependency-analyser.php
      - composer.json
      - tools/composer.json

env:
  DEFAULT_PHP_VERSION: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-structure:
    name: Check package structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.DEFAULT_PHP_VERSION }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ env.DEFAULT_PHP_VERSION }}-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      - name: Run architecture boundary checks
        run: composer arch:check

      - name: Run dependency analysis
        run: composer deps:check

  standalone-install:
    name: Install ${{ matrix.package }} standalone
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nexusphp/mcp-core
            class: Nexus\Mcp\Core\Transport\LineDuplex
          - package: nexusphp/mcp-server
            class: Nexus\Mcp\Server\Server
          - package: nexusphp/mcp-client
            class: Nexus\Mcp\Client\Client
          - package: nexusphp/mcp-extensions
            class: Nexus\Mcp\Extension\Tasks\Tasks

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: none

      - name: Require the component from the component manifests
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/standalone"
          cd "$RUNNER_TEMP/standalone"
          echo '{"minimum-stability": "dev", "prefer-stable": true}' > composer.json
          for component in Core Server Client Extension; do
            name="$(jq -r .name "$GITHUB_WORKSPACE/src/$component/composer.json")"
            composer config "repositories.$component" --json "{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE/src/$component\", \"options\": {\"versions\": {\"$name\": \"1.0.0\"}}}"
          done
          composer require "$PACKAGE:1.0.0" --no-interaction --ansi

      - name: Autoload a class from the component
        env:
          CLASS: ${{ matrix.class }}
        run: |
          cd "$RUNNER_TEMP/standalone"
          php -r 'require "vendor/autoload.php"; exit(class_exists(getenv("CLASS")) ? 0 : 1);'
