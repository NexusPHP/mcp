name: Unit Tests

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/unit-tests.yml
      - src/**
      - tests/**
      - composer.json
      - phpunit.dist.xml
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/unit-tests.yml
      - src/**
      - tests/**
      - composer.json
      - phpunit.dist.xml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  unit-tests:
    name: Tests on PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          ini-values: zend.assertions=1, assert.exception=1, error_reporting=-1, display_errors=On, display_startup_errors=On

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-
            composer-

      - name: Install dependencies
        run: |
          composer update --ansi
          composer audit --ansi --abandoned=report

      - name: Run unit tests
        run: composer test:unit

      - name: Enforce 100% line coverage
        run: composer coverage:check

  windows-tests:
    name: Tests on Windows (PHP 8.5)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: validate

    steps:
      - name: Normalize git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: sodium
          coverage: none
          ini-values: zend.assertions=1, assert.exception=1, error_reporting=-1, display_errors=On, display_startup_errors=On

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-windows-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-windows-

      - name: Install dependencies
        run: composer update --ansi

      - name: Run core tests
        run: composer test:core

      - name: Run server tests
        run: composer test:server

      - name: Run client tests
        run: composer test:client

      - name: Run extension tests
        run: composer test:extension
