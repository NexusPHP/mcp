name: Auto Review

on:
  push:
    branches:
      - 1.x
    paths:
      - .github/workflows/auto-review.yml
      - src/**
      - tests/AutoReview/**
      - composer.json
      - phpunit.dist.xml
  pull_request:
    branches:
      - 1.x
    paths:
      - .github/workflows/auto-review.yml
      - src/**
      - tests/AutoReview/**
      - composer.json
      - phpunit.dist.xml

env:
  DEFAULT_PHP_VERSION: '8.4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto-review:
    name: Automatic Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ env.DEFAULT_PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ env.DEFAULT_PHP_VERSION }}-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      - name: Run Composer security audit
        run: composer audit --ansi --abandoned=report

      - name: Run automatic code review tests
        run: composer test:auto-review
