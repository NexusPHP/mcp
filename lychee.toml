include_mail = false

exclude_path = [
    ".claude",
    "api/vendor",
    "build",
    "tools/vendor",
    "vendor",
]

# Release-tag and version-compare URLs only resolve once the tag is pushed.
# The API reference site only resolves once GitHub Pages has published it.
exclude = [
    'https://github\.com/NexusPHP/mcp-sdk/releases/tag/',
    'https://github\.com/NexusPHP/mcp-sdk/compare/',
    'https://nexusphp\.github\.io/mcp-sdk',
]
