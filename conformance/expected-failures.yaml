# Conformance scenarios this SDK does not pass yet.
#
# The referee exits 0 when the only failures are listed here, 1 on an unlisted
# failure, and 1 on a *stale* entry: a listed scenario that has started passing.
# That last rule is the point. It forces the list to burn down instead of rot.
#
# Baselined against the referee pinned in run-server.sh, at
# `--spec-version 2026-07-28 --suite all`. Bump the pin and reconcile this file
# in the same change, never separately.
#
# Entries are bare scenario names. Per-check granularity is `scenario:check-id`,
# and mind the space: `- scenario:check-id` is a string, `- scenario: check-id`
# is a mapping and is not what the referee reads. Wholesale and per-check
# entries for one scenario are contradictory and rejected.
#
# Every entry names what will retire it.

server:
  # Server-side MRTR (SEP-2322) is served, and these four are what remains. Each needs
  # the server to emit an `InputRequest` for `sampling/createMessage` or `roots/list`.
  # The spec's `InputRequest` union is closed to `CreateMessageRequest | ListRootsRequest
  # | ElicitRequest`, and `latest-schema.ts` marks the first two `@deprecated` as of
  # 2026-07-28 (SEP-2577) while leaving `ElicitRequest` unmarked. This SDK dropped both
  # under that deprecation, so it can ask for elicitation and nothing else.
  #
  # `capability-check` is the same gap seen from the other side: the referee declares
  # `sampling` and no `elicitation`, then requires an `InputRequiredResult` naming
  # sampling. An elicitation-only server has nothing it may ask that client for, so the
  # spec-correct answer is `-32021` with `requiredCapabilities: {elicitation: {}}`, which
  # the check scores as a failure because it rejects every JSON-RPC error. The only other
  # way past it is an `InputRequiredResult` carrying `requestState` and no
  # `inputRequests`, which the check waves through and which would ask the client for
  # nothing, forever. Do not do that to buy the check.
  #
  # Emitting either request is adopting a deprecated feature, which the spec tells a new
  # implementation not to do, so no work on this side retires these four. They go if the
  # referee stops requiring the deprecated half of the union, tracked upstream at
  # https://github.com/modelcontextprotocol/conformance/issues/439.
  - input-required-result-basic-sampling
  - input-required-result-basic-list-roots
  - input-required-result-multiple-input-requests
  - input-required-result-capability-check

  # `wire-schema-valid` arrived in referee 0.2.0-alpha.11 and validates every message the
  # implementation sent against the base schema for the negotiated spec version. A task-supporting
  # `tools/call` answers with SEP-2663's `CreateTaskResult`, and the base 2026-07-28 schema defines no
  # task shape at all, so the check reads the response as a `CallToolResult` and reports the missing
  # `content`. The referee contradicts itself on the same message: `tasks-per-request-meta-opt-in`
  # passes only because that response IS a `CreateTaskResult`.
  #
  # No work on this side retires these. They go when the referee's validator gains a `resultType: "task"`
  # branch, tracked upstream at https://github.com/modelcontextprotocol/conformance/issues/424.
  - tasks-capability-negotiation:wire-schema-valid
  - tasks-dispatch-and-envelope:wire-schema-valid
  - tasks-lifecycle:wire-schema-valid
  - tasks-mrtr-composition:wire-schema-valid
  - tasks-mrtr-input:wire-schema-valid
  - tasks-request-headers:wire-schema-valid
  - tasks-request-state-removal:wire-schema-valid
  - tasks-wire-fields:wire-schema-valid

client: []
