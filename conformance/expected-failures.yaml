# Conformance scenarios this SDK does not pass yet.
#
# The referee exits 0 when the only failures are listed here, 1 on an unlisted
# failure, and 1 on a *stale* entry: a listed scenario that has started passing.
# That last rule is the point. It forces the list to burn down instead of rot.
#
# Baselined against the referee pinned in run-server.sh, at
# `--spec-version 2026-07-28 --suite all`. Bump the pin and reconcile this file
# in the same change, never separately.
#
# Entries are bare scenario names. Per-check granularity is `scenario:check-id`,
# and mind the space: `- scenario:check-id` is a string, `- scenario: check-id`
# is a mapping and is not what the referee reads. Wholesale and per-check
# entries for one scenario are contradictory and rejected.
#
# Every entry names what will retire it.

server:
  # Server-side MRTR (SEP-2322) is served, and these four are what remains. Each needs
  # the server to emit an `InputRequest` for `sampling/createMessage` or `roots/list`.
  # The spec's `InputRequest` union is closed to `CreateMessageRequest | ListRootsRequest
  # | ElicitRequest`, and `latest-schema.ts` marks the first two `@deprecated` as of
  # 2026-07-28 (SEP-2577) while leaving `ElicitRequest` unmarked. This SDK dropped both
  # under that deprecation, so it can ask for elicitation and nothing else.
  #
  # `capability-check` is the same gap seen from the other side: the referee declares
  # `sampling` and no `elicitation`, then requires an `InputRequiredResult` naming
  # sampling. An elicitation-only server has nothing it may ask that client for.
  #
  # Retired by deciding whether to model the two deprecated request types as
  # `InputRequest` payloads. See ROADMAP.md.
  - input-required-result-basic-sampling
  - input-required-result-basic-list-roots
  - input-required-result-multiple-input-requests
  - input-required-result-capability-check

client: []
