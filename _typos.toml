[default]
locale = "en-gb"

extend-ignore-words-re = [
    "(?i)^(un)?(initializ|serializ|normaliz|optimiz|authoriz|contextualiz)(e|es|ed|er|ations?)$",
    "(?i)^(colors?|flavor(ed)?)$",
    "(?i)^fibers?$",
]

# Spec-verbatim MCP schema descriptions are American English and are pinned by
# the conformance test, so the American spelling stays only inside these phrases.
extend-ignore-re = [
    "Controls tool selection behavior for sampling requests\\.",
    "tool behavior \\(including descriptive properties",
    "consistent behavior between HTTP and STDIO\\.",
    "agreed to honor\\.",
]

[files]
# Contributor Covenant is a verbatim third-party document in American English.
# The ApiGen glue carries upstream American spellings (the `analyzer.filter`
# service name and the `ApiGen\Analyzer` base class) that cannot be changed.
extend-exclude = ["CODE_OF_CONDUCT.md", "api/apigen.neon", "api/src"]
