[default]
locale = "en-gb"

extend-ignore-words-re = [
    "(?i)^(initializ|serializ|normaliz|optimiz|authoriz|contextualiz)(e|es|ed|er|ation)$",
    "(?i)^(colors?|flavor(ed)?)$",
    "(?i)^fibers?$",
]

# Spec-verbatim MCP schema descriptions are American English and are pinned by
# the conformance test, so the American spelling stays only inside these phrases.
extend-ignore-re = [
    "Controls tool selection behavior for sampling requests\\.",
    "tool behavior \\(including descriptive properties",
]

[files]
# Contributor Covenant is a verbatim third-party document in American English.
extend-exclude = ["CODE_OF_CONDUCT.md"]
